<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каталог — БАЛС.РУС</title>
<style>
  :root{--bg:#0f1115;--card:#181b22;--text:#eef0f4;--muted:#8b93a7;--accent:#f2b134;--line:#262b36;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .box{max-width:480px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:40px 30px;}
  h1{font-size:24px;margin:0 0 10px;}
  p{color:var(--muted);font-size:15px;line-height:1.6;margin:0 0 24px;}
  .btn{display:inline-block;padding:12px 22px;border-radius:10px;background:var(--accent);color:#1a1200;font-weight:600;text-decoration:none;}
  a.back{display:block;margin-top:16px;color:var(--muted);font-size:13px;}
</style>
</head>
<body>
  <div class="box">
    <h1>🛠️ Каталог в разработке</h1>
    <p>Мы наполняем каталог продукции. Пока проще всего написать нам напрямую — подберём то, что нужно, вручную.</p>
    <a class="btn" href="mailto:bnd@rkb.ru?subject=Запрос%20по%20каталогу%20балс.рус">Написать на почту</a>
    <a class="back" href="index.html">← Вернуться назад</a>
  </div>
</body>
</html>
